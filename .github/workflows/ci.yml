name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install OpenCascade's system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
      - run: uv sync
      - name: Fast checks
        run: uv run pytest -m "not slow"
      - name: Build real parts and read them back
        run: uv run pytest -m slow
