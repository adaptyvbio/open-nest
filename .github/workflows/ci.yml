name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install OpenCascade's system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
      - run: uv sync
      - name: Fast checks
        run: uv run pytest -m "not slow"
      - name: Build real parts and read them back
        run: uv run pytest -m slow

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Package this version
        id: package
        run: uv run cad/package_release.py dist >> "$GITHUB_OUTPUT"
      - name: Publish a release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
          else
            gh release create "$TAG" dist/assets/* --target "$GITHUB_SHA" --title "OpenNest $TAG" --notes-file dist/notes.md
          fi
